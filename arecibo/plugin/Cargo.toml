[workspace]
members = ["xtask"]

[package]
name = "arecibo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
# A standalone app for trying the panel without a host (not needed for the plugin).
standalone = ["nih_plug/standalone"]

[[bin]]
name = "arecibo-standalone"
required-features = ["standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
strip = "symbols"
