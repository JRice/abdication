[workspace]
members = ["xtask"]

[package]
name = "dracones"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
# A standalone app for trying the panel without a host (not needed for the plugin).
standalone = ["nih_plug/standalone"]

[[bin]]
name = "dracones-standalone"
required-features = ["standalone"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
# Argent's Fizmo tables are drawn from spectra.
realfft = "3.4"
# Tiles for the panel's sea and hatching (femtovg's image types).
imgref = "1.6"
rgb = "0.8"

[profile.release]
lto = "thin"
strip = "symbols"
